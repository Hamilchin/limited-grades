name: Deploy to GitHub Pages

# Builds the static site: card pools from Scryfall (and 17Lands grades only if the repository
# variable INCLUDE_17LANDS is "true"), refreshed every 6 hours.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep fetched card pools between runs so Scryfall (and 17Lands) are asked as rarely as possible.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: card-data-${{ github.run_id }}
          restore-keys: card-data-
      - run: npm run data
        env:
          INCLUDE_17LANDS: ${{ vars.INCLUDE_17LANDS }}
      - run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
